<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz 👻</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
#app{
  width:90%;
  max-width:420px;
  background:#111;
  border:2px solid #900;
  border-radius:12px;
  padding:20px;
  box-shadow:0 0 20px #400;
  text-align:center;
}
h1,h2{color:#ff2a2a;}
button{
  width:100%;
  padding:12px;
  margin:8px 0;
  background:#222;
  color:#fff;
  border:1px solid #900;
  border-radius:8px;
  font-size:16px;
}
button:hover{background:#900;}
#bar{
  height:8px;
  background:#400;
  border-radius:6px;
  overflow:hidden;
  margin:10px 0;
}
#fill{
  height:100%;
  width:100%;
  background:#f00;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ===== BANCO ===== */
const banco = {
  terror: [
    { q:"Quem é o vilão do filme Halloween?", o:["Freddy","Jason","Michael Myers","Chucky"], c:2 },
    { q:"Qual assassino usa máscara de hóquei?", o:["Leatherface","Michael Myers","Jason","Ghostface"], c:2 },
    { q:"Em Sexta-Feira 13, onde se passa?", o:["Crystal Lake","Silent Hill","Haddonfield","Elm Street"], c:0 }
  ],
  lendas: [
    { q:"Lenda de banheiros escolares?", o:["Loira do Banheiro","Cuca","Iara","Mula"], c:0 },
    { q:"Criatura de pés virados?", o:["Saci","Curupira","Boitatá","Boto"], c:1 }
  ]
};

let perguntas=[], atual=0, pontos=0, tempo=15, intervalo=null;
const app=document.getElementById("app");

/* ===== TELAS ===== */
function telaInicial(){
  app.innerHTML=`
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar?</p>
    <button onclick="telaTempo()">Iniciar</button>
  `;
}

function telaTempo(){
  app.innerHTML=`
    <h2>Escolha o tempo</h2>
    <button onclick="definirTempo(15)">15s</button>
    <button onclick="definirTempo(20)">20s</button>
    <button onclick="definirTempo(30)">30s</button>
  `;
}

function definirTempo(t){
  tempo=t;
  telaTema();
}

function telaTema(){
  app.innerHTML=`
    <h2>Escolha o tema</h2>
    <button onclick="iniciar('terror')">🔪 Terror</button>
    <button onclick="iniciar('lendas')">🌫️ Lendas</button>
  `;
}

/* ===== QUIZ ===== */
function iniciar(tema){
  perguntas=[...banco[tema]];
  atual=0;
  pontos=0;
  carregar();
}

function carregar(){
  const p=perguntas[atual];
  app.innerHTML=`
    <h2>${p.q}</h2>
    <div id="bar"><div id="fill"></div></div>
    ${p.o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p>Pontos: ${pontos}</p>
  `;
  app.style.borderColor="#900";
  iniciarTempo();
}

function iniciarTempo(){
  let t=tempo;
  const fill=document.getElementById("fill");
  fill.style.width="100%";
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    t--;
    fill.style.width=(t/tempo*100)+"%";
    if(t<=0){
      clearInterval(intervalo);
      responder(-1);
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);

  if(i===perguntas[atual].c){
    pontos++;
    app.style.borderColor="lime";
    app.insertAdjacentHTML("beforeend",
      "<p style='color:lime;font-weight:bold'>✔ Acertou!</p>");
  }else{
    app.style.borderColor="red";
    app.insertAdjacentHTML("beforeend",
      "<p style='color:red;font-weight:bold'>✖ Errou!</p>");
  }

  setTimeout(()=>{
    atual++;
    atual<perguntas.length ? carregar() : fim();
  },800);
}

/* ===== FIM ===== */
function fim(){
  app.innerHTML=`
    <h2>Fim do jogo</h2>
    <p>Pontuação: <b>${pontos}</b></p>
    <input id="nome" placeholder="Seu nome">
    <button onclick="salvar()">Salvar ranking</button>
    <button onclick="telaInicial()">Voltar</button>
  `;
}

function salvar(){
  const nome=document.getElementById("nome").value||"Anônimo";
  const r=JSON.parse(localStorage.getItem("ranking")||"[]");
  r.push({nome,pontos});
  localStorage.setItem("ranking",JSON.stringify(r));
  telaRanking();
}

function telaRanking(){
  const r=JSON.parse(localStorage.getItem("ranking")||"[]");
  app.innerHTML=`
    <h2>Ranking</h2>
    ${r.map(x=>`<p>${x.nome}: ${x.pontos}</p>`).join("")}
    <button onclick="telaInicial()">Voltar</button>
  `;
}

telaInicial();
</script>
</body>
</html>
