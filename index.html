<script>
const app = document.getElementById("app");

/* ===== ÁUDIOS ===== */
const soundCorrect = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const soundWrong   = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
const soundTime    = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* desbloqueio obrigatório no mobile */
document.addEventListener("click", () => {
  [soundCorrect, soundWrong, soundTime].forEach(s => {
    s.play().then(() => {
      s.pause();
      s.currentTime = 0;
    }).catch(()=>{});
  });
}, { once:true });

/* ===== PERGUNTAS ===== */
const banco = {
  terror: [
    { q:"Quem é o vilão de Halloween?", o:["Freddy Krueger","Jason Voorhees","Michael Myers","Chucky"], c:2 }
  ],
  invocacao: [
    { q:"Qual filme faz parte do universo Invocação do Mal?", o:["Jogos Mortais","Annabelle","O Iluminado","A Bruxa"], c:1 }
  ],
  lendas: [
    { q:"Qual é uma lenda urbana famosa?", o:["Loira do Banheiro","Alienígena","Drácula","Kraken"], c:0 }
  ]
};

let perguntas = [];
let atual = 0;
let pontos = 0;
let tempo = 15;
let intervalo = null;

/* ===== TELAS ===== */
function telaInicial(){
  app.innerHTML = `
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar nesta dimensão?<br>Responda ao quiz… ou perca sua alma.</p>
    <button onclick="telaTempo()">Iniciar Quiz</button>
  `;
}

function telaTempo(){
  app.innerHTML = `
    <h2>Escolha o tempo</h2>
    <button onclick="definirTempo(15)">15 segundos</button>
    <button onclick="definirTempo(30)">30 segundos</button>
  `;
}

function definirTempo(t){
  tempo = t;
  telaTema();
}

function telaTema(){
  app.innerHTML = `
    <h2>Escolha o tema… se tiver coragem</h2>
    <button onclick="selecionarTema('terror')">🔪 Terror Clássico</button>
    <button onclick="selecionarTema('invocacao')">📖 Invocação do Mal</button>
    <button onclick="selecionarTema('lendas')">🌫️ Lendas Urbanas</button>
  `;
}

function selecionarTema(t){
  perguntas = banco[t];
  atual = 0;
  pontos = 0;
  carregar();
}

/* ===== QUIZ ===== */
function carregar(){
  clearInterval(intervalo);
  let restante = tempo;

  app.innerHTML = `
    <h3>${perguntas[atual].q}</h3>
    <p id="timer">⏱ ${restante}s</p>
    ${perguntas[atual].o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p id="feedback"></p>
  `;

  intervalo = setInterval(()=>{
    restante--;
    document.getElementById("timer").innerText = "⏱ "+restante+"s";
    if(restante<=0){
      clearInterval(intervalo);
      soundTime.play();
      document.getElementById("feedback").innerText="⏰ Tempo esgotado!";
      setTimeout(proxima,800);
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);
  if(i===perguntas[atual].c){
    pontos++;
    soundCorrect.play();
    document.getElementById("feedback").innerText="✔ Correto!";
  }else{
    soundWrong.play();
    document.getElementById("feedback").innerText="✖ Errado!";
  }
  setTimeout(proxima,800);
}

function proxima(){
  atual++;
  atual<perguntas.length ? carregar() : fim();
}

function fim(){
  app.innerHTML = `
    <h2>Sua alma foi julgada…</h2>
    <p>Pontuação final: <b>${pontos}</b></p>
    <button onclick="telaInicial()">Tentar novamente</button>
  `;
}

telaInicial();
</script>
