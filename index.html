<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ghost Quiz 👻</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#000; --card:#111; --red:#b30000; --red2:#ff1a1a; --txt:#fff;
}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:Arial,sans-serif; height:100vh;
  display:flex; align-items:center; justify-content:center;
}
.box{
  width:90%; max-width:420px; background:var(--card);
  border:2px solid var(--red); border-radius:14px;
  padding:16px; box-shadow:0 0 22px #400; text-align:center;
}
h1{ color:#ff2a2a; margin:0 0 6px; }
#score{ margin:6px 0; }

/* opções */
.opts{
  display:flex; gap:8px; justify-content:center; margin:8px 0;
}
.opts button{ flex:1; padding:8px; font-size:14px; }
.opts .active{ background:var(--red); }

/* barra */
.timer-wrap{
  width:100%; height:12px; background:#222;
  border-radius:10px; overflow:hidden; margin:6px 0 10px;
  border:1px solid #400;
}
.timer-bar{
  height:100%; width:100%;
  background:linear-gradient(180deg,var(--red2),var(--red));
  transition:width .2s linear;
}
.timer-num{ font-size:14px; opacity:.9; margin-bottom:4px; }

button{
  width:100%; padding:12px; margin:8px 0;
  background:#222; color:#fff;
  border:1px solid var(--red); border-radius:10px;
  font-size:16px;
}
button:hover{ background:var(--red); }

#feedback{ margin-top:8px; font-weight:bold; min-height:20px; }
.shake{ animation:shake .25s linear 2; }
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-4px)}
  100%{transform:translateX(0)}
}
</style>
</head>
<body>

<div class="box" id="box">
  <h1>Ghost Quiz 👻</h1>

  <div class="opts">
    <button onclick="setTempo(15)" id="t15" class="active">15s</button>
    <button onclick="setTempo(20)" id="t20">20s</button>
    <button onclick="setTempo(30)" id="t30">30s</button>
  </div>

  <div class="opts">
    <button onclick="toggleShuffle()" id="shuffleBtn">Embaralhar: OFF</button>
  </div>

  <div class="timer-num">⏱️ <span id="tNum">15</span>s</div>
  <div class="timer-wrap">
    <div class="timer-bar" id="tBar"></div>
  </div>

  <div id="score">Pontos: 0</div>
  <p id="question"></p>
  <div id="answers"></div>
  <div id="feedback"></div>
</div>

<script>
const basePerguntas=[
 {q:"Quem é o vilão de Halloween?",a:["Freddy Krueger","Jason Voorhees","Michael Myers","Chucky"],c:2},
 {q:"Qual filme faz parte do universo Invocação do Mal?",a:["Jogos Mortais","Annabelle","O Iluminado","A Bruxa"],c:1}
];

let perguntas=[...basePerguntas];
let shuffleOn=false;

let atual=0, pontos=0;
let tempoTotal=15, tempo=15, intervalo;

const tBar=document.getElementById("tBar");
const tNum=document.getElementById("tNum");
const box=document.getElementById("box");

function setTempo(v){
  tempoTotal=v;
  ["15","20","30"].forEach(n=>document.getElementById("t"+n).classList.remove("active"));
  document.getElementById("t"+v).classList.add("active");
}

function toggleShuffle(){
  shuffleOn=!shuffleOn;
  document.getElementById("shuffleBtn").innerText =
    "Embaralhar: " + (shuffleOn ? "ON" : "OFF");
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function iniciarQuiz(){
  perguntas=[...basePerguntas];
  if(shuffleOn) shuffle(perguntas);
  atual=0; pontos=0;
  carregar();
}

function carregar(){
  document.getElementById("feedback").innerText="";
  document.getElementById("score").innerText="Pontos: "+pontos;
  document.getElementById("question").innerText=perguntas[atual].q;
  const div=document.getElementById("answers");
  div.innerHTML="";
  perguntas[atual].a.forEach((txt,i)=>{
    const b=document.createElement("button");
    b.innerText=txt;
    b.onclick=()=>responder(i);
    div.appendChild(b);
  });
  iniciarTempo();
}

function responder(i){
  clearInterval(intervalo);
  const correta=perguntas[atual].c;
  if(i===correta){
    pontos+=10;
    feedback("✔️ Correto!", "#0f0");
  }else{
    feedback("❌ Errado! Correta: "+perguntas[atual].a[correta], "#f00");
    box.classList.add("shake");
    setTimeout(()=>box.classList.remove("shake"),300);
  }
  setTimeout(proxima, 900);
}

function feedback(txt,color){
  const f=document.getElementById("feedback");
  f.innerText=txt; f.style.color=color;
}

function iniciarTempo(){
  tempo=tempoTotal;
  tNum.innerText=tempo;
  tBar.style.width="100%";
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    tempo--;
    tNum.innerText=tempo;
    tBar.style.width=(tempo/tempoTotal*100)+"%";
    if(tempo<=0){
      clearInterval(intervalo);
      feedback("⏰ Tempo esgotado!", "#ff6");
      box.classList.add("shake");
      setTimeout(()=>box.classList.remove("shake"),300);
      setTimeout(proxima, 700);
    }
  },1000);
}

function proxima(){
  atual++;
  if(atual<perguntas.length){ carregar(); }
  else fim();
}

function fim(){
  box.innerHTML=
    "<h1>Fim do Quiz 👻</h1>"+
    "<p>Pontuação final: <b>"+pontos+"</b></p>"+
    "<button onclick='location.reload()'>Jogar novamente</button>";
}

iniciarQuiz();
const somErro = new Audio("https://assets.mixkit.co/active_storage/sfx/950/950-preview.mp3");
document.addEventListener("click", () => {
  somErro.play().then(() => {
    somErro.pause();
    somErro.currentTime = 0;
  }).catch(()=>{});
}, { once: true });
</script>
</body>
</html>
