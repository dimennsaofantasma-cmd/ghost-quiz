<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ghost Quiz 👻</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  width: 90%;
  max-width: 420px;
  background: #111;
  border: 2px solid #900;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 0 20px #400;
  text-align: center;
}

h1 {
  color: #ff2a2a;
}

button {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  background: #222;
  color: #fff;
  border: 1px solid #900;
  border-radius: 8px;
  font-size: 16px;
}

button:hover {
  background: #900;
}
</style>
</head>

<body>

<div class="box" id="tela">
  <h1>Ghost Quiz 👻</h1>
  <p>Escolha o tema… se tiver coragem.</p>

  <button onclick="escolherTema('terror')">🔪 Terror Clássico</button>
  <button onclick="escolherTema('invocacao')">📖 Invocação do Mal</button>
  <button onclick="escolherTema('lendas')">🌫️ Lendas Urbanas</button>
</div>

<script>
let temaEscolhido = "";

function escolherTema(tema) {
  temaEscolhido = tema;

  document.getElementById("tela").innerHTML = `
    <h1>👻 Tema escolhido</h1>
    <p>${tema.toUpperCase()}</p>
    <button onclick="iniciarQuiz()">Iniciar Quiz</button>
  `;
}

function iniciarQuiz() {
  document.getElementById("tela").innerHTML = `
    <h1>Em breve…</h1>
    <p>O quiz do tema <b>${temaEscolhido}</b> vai começar.</p>
  `;
}
</script>

</body>
</html>
