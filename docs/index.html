<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dimensão Fantasma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #200000, #000000 70%);
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 420px;
      padding: 20px;
    }

    h1 {
      color: #b30000;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #000;
    }

    h2 {
      color: #ff6666;
      font-size: 1.1rem;
      font-weight: normal;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      background: linear-gradient(180deg, #7a0000, #3a0000);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 0 0 15px #000;
    }

    .btn:hover {
      background: linear-gradient(180deg, #a00000, #500000);
    }

    .em-breve {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #999;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Dimensão Fantasma</h1>
    <h2>Maratona de filmes de terror e suspense</h2>

    <a href="/ghost-quiz/" class="btn">
      Entrar no Ghost Quiz
    </a>

    <a href="maratona.html" class="btn">
      Entrar na Maratona Fantasma
    </a>

    <div class="em-breve">
      Ghost Quiz completo em breve…
    </div>
  </div>
</body>
</html>
