<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b0b;
  color:#eee;
}
#app{
  max-width:600px;
  margin:30px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
  text-align:center;
}
button{
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#8b0000;
  color:#fff;
}
input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:none;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* ===== ÁUDIO (1 SOM - ESTÁVEL MOBILE) ===== */
const audio = new Audio();
document.addEventListener("click",()=>{
  audio.src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg";
  audio.play().then(()=>{
    audio.pause();
    audio.currentTime=0;
  }).catch(()=>{});
},{once:true});

function somAcerto(){
  audio.src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg";
  audio.play().catch(()=>{});
}
function somErro(){
  audio.src="https://actions.google.com/sounds/v1/cartoon/boing.ogg";
  audio.play().catch(()=>{});
}

/* ===== BANCO DE PERGUNTAS ===== */
const banco = {
  terror: [
    {
      q: "Quem é o vilão do filme Halloween?",
      o: ["Freddy Krueger","Jason Voorhees","Michael Myers","Chucky"],
      c: 2
    }
  ],
  lendas: [
    {
      q: "Qual lenda urbana é famosa em escolas?",
      o: ["Loira do Banheiro","Kraken","Drácula","Múmia"],
      c: 0
    }
  ]
};

let perguntas = [];
let atual = 0;
let pontos = 0;
let tempo = 15;
let intervalo = null;

/* ===== TELAS ===== */
const app = document.getElementById("app");

function telaInicial(){
  app.innerHTML = `
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar nesta dimensão?</p>
    <button onclick="telaTempo()">Iniciar Quiz</button>
  `;
}

function telaTempo(){
  app.innerHTML = `
    <h2>Escolha o tempo</h2>
    <button onclick="definirTempo(15)">15 segundos</button>
    <button onclick="definirTempo(30)">30 segundos</button>
  `;
}

function definirTempo(t){
  tempo = t;
  telaTema();
}

function telaTema(){
  app.innerHTML = `
    <h2>Escolha o tema</h2>
    <button onclick="selecionarTema('terror')">🔪 Terror</button>
    <button onclick="selecionarTema('lendas')">🌫️ Lendas Urbanas</button>
  `;
}

function selecionarTema(t){
  perguntas = banco[t];
  atual = 0;
  pontos = 0;
  carregarPergunta();
}

/* ===== QUIZ ===== */
function carregarPergunta(){
  clearInterval(intervalo);
  let restante = tempo;

  app.innerHTML = `
    <h3>${perguntas[atual].q}</h3>
    <p id="timer">⏱ ${restante}s</p>
    ${perguntas[atual].o.map((op,i)=>
      `<button onclick="responder(${i})">${op}</button>`
    ).join("")}
    <p id="feedback"></p>
  `;

  intervalo = setInterval(()=>{
    restante--;
    document.getElementById("timer").innerText = "⏱ " + restante + "s";

    if(restante <= 0){
      clearInterval(intervalo);
      somErro();
      document.getElementById("feedback").innerText = "⏰ Tempo esgotado!";
      setTimeout(proximaPergunta, 800);
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);

  if(i === perguntas[atual].c){
    pontos++;
    somAcerto();
    document.getElementById("feedback").innerText = "✔ Correto!";
  }else{
    somErro();
    document.getElementById("feedback").innerText = "✖ Errado!";
  }

  setTimeout(proximaPergunta, 800);
}

function proximaPergunta(){
  atual++;
  if(atual >= perguntas.length){
    fimQuiz();
  }else{
    carregarPergunta();
  }
}

/* ===== FINAL ===== */
function fimQuiz(){
  app.innerHTML = `
    <h2>Sua alma foi julgada… 👻</h2>
    <p>Pontuação final: <b>${pontos}</b></p>
    <button onclick="telaInicial()">Jogar novamente</button>
  `;
}

/* START */
telaInicial();
</script>

</body>
</html>
