<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dimensão Fantasma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #000;
      color: #eee;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #b30000;
      text-shadow: 0 0 10px #500;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #111;
      border-left: 4px solid #600;
      padding: 20px;
      margin-bottom: 20px;
    }

    .danger {
      border-left-color: #b30000;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #8b0000;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(139,0,0,0.6);
    }
  </style>
</head>

<body>

  <header>
    <h1>Dimensão Fantasma</h1>
    <p>Bem-vindo ao lugar onde o medo observa você.</p>
  </header>

  <main>
    <div class="card">
      <h2>👻 Aviso</h2>
      <p>
        Nem tudo que está aqui deveria ser encontrado.
        Prossiga por sua conta e risco.
      </p>
    </div>

    <div class="card danger">
      <h2>🩸 Ghost Quiz</h2>
      <p>Você tem coragem de enfrentar o desafio?</p>

      <a href="quiz inicial.html" class="btn">
        👉 Entrar no Ghost Quiz
      </a>
    </div>
  </main>

</body>
</html>
