<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz 👻</title>

<!-- Fonte estilo terror -->
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#000;
  color:#ddd;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

#app{
  width:90%;
  max-width:420px;
  background:#0b0b0b;
  border:2px solid #900;
  border-radius:14px;
  padding:22px;
  box-shadow:0 0 25px #400;
  text-align:center;
  transition: border-color .3s;
}

h1{
  font-family:'Creepster', cursive;
  color:#c00000;
  font-size:42px;
  margin-bottom:10px;
}

h2{
  color:#e6e6e6;
}

p{
  color:#bbb;
}

button{
  width:100%;
  padding:14px;
  margin:8px 0;
  background:#1a1a1a;
  color:#eee;
  border:1px solid #700;
  border-radius:10px;
  font-size:16px;
}

button:hover{
  background:#700;
}

#bar{
  height:10px;
  background:#300;
  border-radius:6px;
  overflow:hidden;
  margin:12px 0;
}

#fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg, #ff0000, #800000);
  transition: width 1s linear;
}

.feedback{
  font-weight:bold;
  margin-top:10px;
}

.certo{ color:lime; }
.errado{ color:red; }
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ===== BANCO ===== */
const banco = {
  lendas: [
    { q:"Qual lenda urbana aparece em banheiros escolares?",
      o:["Loira do Banheiro","Cuca","Mula-sem-cabeça","Iara"], c:0 },
    { q:"Qual criatura protege as florestas?",
      o:["Saci","Curupira","Boitatá","Boto"], c:1 },
    { q:"Qual lenda seduz pessoas nos rios?",
      o:["Iara","Cuca","Loira do Banheiro","Banshee"], c:0 },
    { q:"Qual criatura tem os pés virados para trás?",
      o:["Saci","Curupira","Cuca","Boitatá"], c:1 }
  ]
};

let perguntas=[], atual=0, pontos=0, tempo=15, intervalo=null;
const app=document.getElementById("app");

/* ===== TELAS ===== */
function telaInicial(){
  app.innerHTML=`
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar nesta dimensão?<br>Responda… ou perca sua alma.</p>
    <button onclick="telaTempo()">Iniciar Quiz</button>
  `;
}

function telaTempo(){
  app.innerHTML=`
    <h2>Escolha o tempo</h2>
    <button onclick="definirTempo(15)">15 segundos</button>
    <button onclick="definirTempo(20)">20 segundos</button>
    <button onclick="definirTempo(30)">30 segundos</button>
  `;
}

function definirTempo(t){
  tempo=t;
  iniciar();
}

/* ===== QUIZ ===== */
function iniciar(){
  perguntas=[...banco.lendas];
  atual=0;
  pontos=0;
  carregar();
}

function carregar(){
  const p=perguntas[atual];
  app.style.borderColor="#900";
  app.innerHTML=`
    <h2>${p.q}</h2>
    <div id="bar"><div id="fill"></div></div>
    ${p.o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p>Pontos: ${pontos}</p>
  `;
  iniciarTempo();
}

function iniciarTempo(){
  let t=tempo;
  const fill=document.getElementById("fill");
  fill.style.width="100%";
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    t--;
    fill.style.width=(t/tempo*100)+"%";
    if(t<=0){
      clearInterval(intervalo);
      erroVisual();
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);
  i===perguntas[atual].c ? acertoVisual() : erroVisual();
}

function acertoVisual(){
  pontos++;
  app.style.borderColor="lime";
  app.insertAdjacentHTML("beforeend",
    `<p class="feedback certo">✔ Acertou!</p>`);
  setTimeout(proxima,800);
}

function erroVisual(){
  app.style.borderColor="red";
  app.insertAdjacentHTML("beforeend",
    `<p class="feedback errado">✖ Errou!</p>`);
  setTimeout(proxima,800);
}

function proxima(){
  atual++;
  atual<perguntas.length ? carregar() : fim();
}

/* ===== FIM ===== */
function fim(){
  app.innerHTML=`
    <h2>Sua alma foi julgada…</h2>
    <p>Pontuação final: <b>${pontos}</b></p>
    <button onclick="telaInicial()">Jogar novamente</button>
  `;
}

telaInicial();
</script>
</body>
</html>
