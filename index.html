<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz</title>

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

body{
  margin:0;
  background:#000;
  color:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

#app{
  width:92%;
  max-width:420px;
  background:#0b0b0b;
  border:2px solid #900;
  border-radius:16px;
  padding:20px;
  box-shadow:0 0 30px #400;
  transition:border-color .3s;
}

h1,h2{text-align:center;color:#c00}

p{text-align:center}

button{
  width:100%;
  padding:14px;
  margin:8px 0;
  background:#111;
  color:#eee;
  border:1px solid #700;
  border-radius:10px;
  font-size:16px;
}

button:hover{background:#700}

#bar{
  height:12px;
  background:#300;
  border-radius:6px;
  overflow:hidden;
  margin:14px 0;
}

#fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff0000,#800000);
  transition:width 1s linear;
}

.feedback{
  font-weight:bold;
  margin-top:10px;
  text-align:center;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const app = document.getElementById("app");
let perguntas=[], atual=0, pontos=0;
let tempo=15, intervalo;

const banco = [
 {q:"Quem é o vilão do filme Halloween?",o:["Freddy Krueger","Jason Voorhees","Michael Myers","Chucky"],c:2},
 {q:"Qual assassino usa máscara de hóquei?",o:["Leatherface","Michael Myers","Jason Voorhees","Ghostface"],c:2},
 {q:"Em Sexta-Feira 13, onde se passa a história?",o:["Silent Hill","Crystal Lake","Elm Street","Haddonfield"],c:1},
 {q:"Qual vilão ataca nos sonhos?",o:["Jason","Chucky","Freddy Krueger","Ghostface"],c:2},
 {q:"Qual filme começa com uma ligação misteriosa?",o:["Halloween","Scream","O Exorcista","Invocação do Mal"],c:1}
];

function telaInicial(){
  app.style.borderColor="#900";
  app.innerHTML=`
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar nesta dimensão?<br>Responda... ou perca sua alma.</p>
    <button onclick="iniciar()">Iniciar Quiz</button>
  `;
}

function iniciar(){
  perguntas=[...banco];
  atual=0; pontos=0;
  carregar();
}

function carregar(){
  const p=perguntas[atual];
  app.style.borderColor="#900";
  app.innerHTML=`
    <h2>${p.q}</h2>
    <div id="bar"><div id="fill"></div></div>
    ${p.o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p>Pontos: ${pontos}</p>
  `;
  iniciarTempo();
}

function iniciarTempo(){
  let t=tempo;
  const fill=document.getElementById("fill");
  fill.style.width="100%";
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    t--;
    fill.style.width=(t/tempo*100)+"%";
    if(t<=0){
      clearInterval(intervalo);
      erro();
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);
  if(i===perguntas[atual].c){
    pontos++;
    app.style.borderColor="lime";
    feedback("✔ Acertou!","lime");
  }else{
    erro();
  }
}

function erro(){
  app.style.borderColor="red";
  feedback("✖ Erro!","red");
}

function feedback(msg,cor){
  app.insertAdjacentHTML("beforeend",`<div class="feedback" style="color:${cor}">${msg}</div>`);
  setTimeout(proxima,800);
}

function proxima(){
  atual++;
  atual<perguntas.length ? carregar() : fim();
}

function fim(){
  app.style.borderColor="#900";
  app.innerHTML=`
    <h2>Sua alma foi julgada...</h2>
    <p>Pontuação final: <b>${pontos}</b></p>
    <button onclick="compartilhar()">Compartilhar</button>
    <button onclick="window.open('https://t.me/DimensaoFantasma','_blank')">Telegram</button>
    <button onclick="telaInicial()">Jogar novamente</button>
  `;
}

function compartilhar(){
  navigator.share?.({
    title:"Ghost Quiz",
    text:`Fiz ${pontos} pontos no Ghost Quiz 👻`,
    url:location.href
  });
}

telaInicial();
</script>
</body>
</html>
