<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ghost Quiz 👻</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      width: 95%;
      max-width: 420px;
      background: #111;
      border: 2px solid #900;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 20px #400;
      text-align: center;
    }

    h1 {
      color: #f33;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #222;
      color: #fff;
      border: 1px solid #900;
      border-radius: 8px;
      font-size: 16px;
    }

    button:hover {
      background: #400;
    }

    .bar {
      height: 10px;
      background: #400;
      margin: 10px 0;
      border-radius: 5px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #f33;
      width: 100%;
      transition: width 1s linear;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const app = document.getElementById("app");

    const banco = {
      terror: [
        {
          q: "Quem é o vilão do filme Halloween?",
          o: ["Freddy Krueger", "Jason Voorhees", "Michael Myers", "Chucky"],
          c: 2
        }
      ],
      lendas: [
        {
          q: "Qual lenda urbana é famosa em escolas?",
          o: ["Loira do Banheiro", "Kraken", "Drácula", "Múmia"],
          c: 0
        }
      ]
    };

    let perguntas = [];
    let atual = 0;
    let pontos = 0;
    let tempoMax = 15;
    let tempo = tempoMax;
    let intervalo = null;

    function telaInicial() {
      app.innerHTML = `
        <h1>Ghost Quiz 👻</h1>
        <p>Você ousa entrar nesta dimensão?<br>Responda ao quiz… ou perca sua alma.</p>
        <button onclick="telaTemas()">Iniciar Quiz</button>
      `;
    }

    function telaTemas() {
      app.innerHTML = `
        <h2>Escolha o tema</h2>
        <button onclick="iniciar('terror')">🔪 Terror Clássico</button>
        <button onclick="iniciar('lendas')">🌫️ Lendas Urbanas</button>
      `;
    }

    function iniciar(tema) {
      perguntas = banco[tema];
      atual = 0;
      pontos = 0;
      tempo = tempoMax;
      carregar();
    }

    function carregar() {
      const p = perguntas[atual];
      app.innerHTML = `
        <div class="bar"><div class="fill" id="fill"></div></div>
        <p><b>${p.q}</b></p>
        ${p.o.map((op, i) =>
          `<button onclick="responder(${i})">${op}</button>`
        ).join("")}
      `;
      iniciarTempo();
    }

    function iniciarTempo() {
      clearInterval(intervalo);
      tempo = tempoMax;
      atualizarBarra();
      intervalo = setInterval(() => {
        tempo--;
        atualizarBarra();
        if (tempo <= 0) {
          clearInterval(intervalo);
          proxima();
        }
      }, 1000);
    }

    function atualizarBarra() {
      const fill = document.getElementById("fill");
      if (fill) fill.style.width = (tempo / tempoMax * 100) + "%";
    }

    function responder(i) {
      clearInterval(intervalo);
      if (i === perguntas[atual].c) pontos++;
      proxima();
    }

    function proxima() {
      atual++;
      atual < perguntas.length ? carregar() : fim();
    }

    function fim() {
      app.innerHTML = `
        <h2>Sua alma foi julgada…</h2>
        <p>Pontuação: <b>${pontos}</b></p>
        <button onclick="telaInicial()">Jogar novamente</button>
      `;
    }

    telaInicial();
  </script>
</body>
</html>
