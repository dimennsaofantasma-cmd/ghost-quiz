<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz 👻</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
#app{
  width:90%;
  max-width:420px;
  background:#111;
  border:2px solid #900;
  border-radius:12px;
  padding:20px;
  box-shadow:0 0 20px #400;
  text-align:center;
}
h1{color:#ff2a2a;}
button{
  width:100%;
  padding:12px;
  margin:8px 0;
  background:#222;
  color:#fff;
  border:1px solid #900;
  border-radius:8px;
  font-size:16px;
}
button:hover{background:#900;}
#bar{
  height:8px;
  background:#400;
  border-radius:6px;
  overflow:hidden;
  margin:10px 0;
}
#fill{
  height:100%;
  width:100%;
  background:#f00;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ===== SONS ===== */
const somAcerto = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const somErro   = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");

/* ===== BANCO ===== */
const banco = {
  terror: [
    {
      q: "Quem é o vilão do filme Halloween?",
      o: ["Freddy Krueger","Jason Voorhees","Michael Myers","Chucky"],
      c: 2
    },
    {
      q: "Qual assassino usa uma máscara de hóquei?",
      o: ["Leatherface","Michael Myers","Jason Voorhees","Ghostface"],
      c: 2
    },
    {
      q: "Em Sexta-Feira 13, onde se passa a história?",
      o: ["Crystal Lake","Silent Hill","Haddonfield","Elm Street"],
      c: 0
    },
    {
      q: "Qual vilão ataca as vítimas nos sonhos?",
      o: ["Jason","Freddy Krueger","Chucky","Pennywise"],
      c: 1
    },
    {
      q: "Qual filme se passa em um hotel isolado?",
      o: ["O Iluminado","O Exorcista","A Bruxa","O Chamado"],
      c: 0
    }
  ],

  invocacao: [
    {
      q: "Qual boneca faz parte do universo Invocação do Mal?",
      o: ["Chucky","Annabelle","Billy","M3GAN"],
      c: 1
    },
    {
      q: "Quem são os investigadores paranormais do filme?",
      o: ["Ed e Lorraine Warren","Mulder e Scully","Van Helsing","Padre Karras"],
      c: 0
    },
    {
      q: "Qual entidade aparece no filme A Freira?",
      o: ["Valak","Pazuzu","Bagul","Baphomet"],
      c: 0
    },
    {
      q: "Qual filme do universo mostra um brinquedo amaldiçoado?",
      o: ["A Freira","Invocação do Mal","Annabelle","O Exorcista"],
      c: 2
    }
  ],

  lendas: [
    {
      q: "Qual lenda urbana aparece em banheiros escolares?",
      o: ["Loira do Banheiro","Cuca","Mula-sem-cabeça","Iara"],
      c: 0
    },
    {
      q: "Qual criatura do folclore protege as florestas?",
      o: ["Saci","Curupira","Boitatá","Boto"],
      c: 1
    },
    {
      q: "Qual lenda seduz pessoas nos rios?",
      o: ["Iara","Cuca","Loira do Banheiro","Banshee"],
      c: 0
    },
    {
      q: "Qual criatura tem os pés virados para trás?",
      o: ["Saci","Curupira","Cuca","Boitatá"],
      c: 1
    }
  

let perguntas=[], atual=0, pontos=0, tempo=15, intervalo=null;
const app = document.getElementById("app");

/* ===== TELAS ===== */
function telaInicial(){
  app.innerHTML=`
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar nesta dimensão?</p>
    <button onclick="telaTempo()">Iniciar Quiz</button>
  `;
}

function telaTempo(){
  app.innerHTML=`
    <h2>Escolha o tempo</h2>
    <button onclick="definirTempo(15)">15 segundos</button>
    <button onclick="definirTempo(20)">20 segundos</button>
    <button onclick="definirTempo(30)">30 segundos</button>
  `;
}

function definirTempo(t){
  tempo=t;
  telaTema();
}

function telaTema(){
  app.innerHTML=`
    <h2>Escolha o tema</h2>
    <button onclick="iniciar('terror')">🔪 Terror Clássico</button>
    <button onclick="iniciar('invocacao')">📖 Invocação do Mal</button>
    <button onclick="iniciar('lendas')">🌫️ Lendas Urbanas</button>
  `;
}

/* ===== QUIZ ===== */
function iniciar(tema){
  perguntas=[...banco[tema]];
  atual=0;
  pontos=0;
  carregar();
}

function carregar(){
  const p=perguntas[atual];
  app.innerHTML=`
    <h2>${p.q}</h2>
    <div id="bar"><div id="fill"></div></div>
    ${p.o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p>Pontos: ${pontos}</p>
  `;
  iniciarTempo();
}

function iniciarTempo(){
  let t=tempo;
  const fill=document.getElementById("fill");
  fill.style.width="100%";
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    t--;
    fill.style.width=(t/tempo*100)+"%";
    if(t<=0){
      clearInterval(intervalo);
      somErro.play().catch(()=>{});
      proxima();
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);
  if(i===perguntas[atual].c){
    pontos++;
    somAcerto.play().catch(()=>{});
  }else{
    somErro.play().catch(()=>{});
  }
  setTimeout(proxima,600);
}

function proxima(){
  atual++;
  atual<perguntas.length ? carregar() : fim();
}

/* ===== FIM ===== */
function fim(){
  app.innerHTML=`
    <h2>Sua alma foi julgada…</h2>
    <p>Pontuação final: <b>${pontos}</b></p>
    <input id="nome" placeholder="Seu nome">
    <button onclick="salvar()">Salvar Ranking</button>
    <button onclick="telaInicial()">Jogar novamente</button>
  `;
}

function salvar(){
  const nome=document.getElementById("nome").value || "Anônimo";
  let r=JSON.parse(localStorage.getItem("ranking")||"[]");
  r.push({nome,pontos});
  localStorage.setItem("ranking",JSON.stringify(r));
  telaRanking();
}

function telaRanking(){
  const r=JSON.parse(localStorage.getItem("ranking")||"[]");
  app.innerHTML=`
    <h2>Ranking</h2>
    ${r.map(x=>`<p>${x.nome}: ${x.pontos}</p>`).join("")}
    <button onclick="telaInicial()">Voltar</button>
  `;
}

telaInicial();
</script>
</body>
</html>
