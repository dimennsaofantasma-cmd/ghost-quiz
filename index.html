<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz 👻</title>

<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Creepster&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#000;
  color:#ffdddd;
  font-family:'Creepster', cursive;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* NEVOA */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://i.imgur.com/8KZQZ6G.png");
  opacity:0.15;
  animation:fog 60s linear infinite;
  pointer-events:none;
}
@keyframes fog{
  from{background-position:0 0;}
  to{background-position:1000px 0;}
}

#app{
  width:90%;
  max-width:420px;
  background:rgba(10,0,0,0.85);
  border:2px solid #700;
  border-radius:14px;
  padding:20px;
  box-shadow:0 0 40px #400;
  text-align:center;
  position:relative;
}

h1{
  font-family:'Nosifer', cursive;
  color:#ff0000;
  font-size:32px;
}

button{
  width:100%;
  padding:12px;
  margin:8px 0;
  background:#220000;
  color:#fff;
  border:1px solid #900;
  border-radius:10px;
  font-size:16px;
}
button:hover{background:#900;}

.telegram{
  background:#0088cc;
  border-color:#0088cc;
}
.telegram:hover{background:#0077b3;}

/* BARRA DE SANGUE */
#bar{
  height:12px;
  background:#330000;
  border-radius:8px;
  overflow:hidden;
  margin:12px 0;
}
#fill{
  height:100%;
  width:100%;
  background:linear-gradient(#ff0000,#660000);
  animation:drip 1.5s infinite linear;
}
@keyframes drip{
  0%{background-position:0 0;}
  100%{background-position:0 40px;}
}

/* FEEDBACK */
.feedback{
  padding:10px;
  border-radius:12px;
  margin:10px 0;
  font-weight:bold;
}
.ok{background:#0a3;color:#000;}
.err{background:#900;color:#fff;}
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ===== BANCO ===== */
const banco = {
  terror:[
    {q:"Quem é o vilão do filme Halloween?",o:["Freddy","Jason","Michael Myers","Chucky"],c:2},
    {q:"Qual assassino usa máscara de hóquei?",o:["Leatherface","Michael","Jason","Ghostface"],c:2}
  ],
  lendas:[
    {q:"Qual lenda aparece em banheiros?",o:["Loira","Cuca","Iara","Banshee"],c:0},
    {q:"Quem protege a floresta?",o:["Saci","Curupira","Boto","Cuca"],c:1}
  ]
};

let perguntas=[],atual=0,pontos=0,tempo=15,intervalo=null,tema="terror",embaralhar=false;
const app=document.getElementById("app");

/* TELAS */
function telaInicial(){
  app.innerHTML=`
    <h1>Ghost Quiz</h1>
    <p>A dimensão se abre…</p>
    <button onclick="telaTempo()">Iniciar</button>
    <button onclick="telaRanking()">Ranking</button>
    <button class="telegram" onclick="window.open('https://t.me/+ewlyVq2Rsno3NGMx','_blank')">Telegram</button>
    <button onclick="window.open('https://docs.google.com/forms','_blank')">Sugerir Tema</button>
  `;
}

function telaTempo(){
  app.innerHTML=`
    <h2>Tempo por pergunta</h2>
    <button onclick="definirTempo(15)">15s</button>
    <button onclick="definirTempo(20)">20s</button>
    <button onclick="definirTempo(30)">30s</button>
  `;
}

function definirTempo(t){
  tempo=t;
  telaTema();
}

function telaTema(){
  app.innerHTML=`
    <h2>Escolha o tema</h2>
    <button onclick="definirTema('terror')">🔪 Terror</button>
    <button onclick="definirTema('lendas')">🌫️ Lendas</button>
    <button onclick="toggleEmbaralhar()">Embaralhar: ${embaralhar?"ON":"OFF"}</button>
  `;
}

function definirTema(t){
  tema=t;
  iniciar();
}

function toggleEmbaralhar(){
  embaralhar=!embaralhar;
  telaTema();
}

/* QUIZ */
function iniciar(){
  perguntas=[...banco[tema]];
  if(embaralhar) perguntas.sort(()=>Math.random()-0.5);
  atual=0;pontos=0;
  carregar();
}

function carregar(){
  const p=perguntas[atual];
  app.innerHTML=`
    <h2>${p.q}</h2>
    <div id="bar"><div id="fill"></div></div>
    ${p.o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p>Pontos: ${pontos}</p>
  `;
  iniciarTempo();
}

function iniciarTempo(){
  let t=tempo;
  const fill=document.getElementById("fill");
  fill.style.width="100%";
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    t--;
    fill.style.width=(t/tempo*100)+"%";
    if(t<=0){
      clearInterval(intervalo);
      mostrarErro("O tempo acabou…");
      setTimeout(proxima,900);
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);
  if(i===perguntas[atual].c){
    pontos++;
    mostrarAcerto("Você sobreviveu!");
  }else{
    mostrarErro("Resposta errada!");
  }
  setTimeout(proxima,900);
}

function mostrarAcerto(t){
  app.insertAdjacentHTML("beforeend",`<div class="feedback ok">${t}</div>`);
}
function mostrarErro(t){
  app.insertAdjacentHTML("beforeend",`<div class="feedback err">${t}</div>`);
}

function proxima(){
  atual++;
  atual<perguntas.length?carregar():fim();
}

/* FIM + RANKING */
function fim(){
  const nome=prompt("Seu nome")||"Anônimo";
  let r=JSON.parse(localStorage.getItem("ranking")||"[]");
  r.push({nome,p:pontos});
  r.sort((a,b)=>b.p-a.p);
  localStorage.setItem("ranking",JSON.stringify(r.slice(0,10)));
  telaRanking();
}

function telaRanking(){
  const r=JSON.parse(localStorage.getItem("ranking")||"[]");
  app.innerHTML=`
    <h2>Ranking Fantasma</h2>
    ${r.map((x,i)=>`<p>${i+1}. ${x.nome} — ${x.p}</p>`).join("")}
    <button onclick="telaInicial()">Voltar</button>
  `;
}

telaInicial();
</script>
</body>
</html>
