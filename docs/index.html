<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dimensão Fantasma</title>

  <style>
    body {
      background: #0b0b0b;
      color: #e6e6e6;
      font-family: Georgia, serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: darkred;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 22px;
      background: darkred;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: #a00000;
    }

    @keyframes tremor {
      0% { transform: translateX(0); }
      20% { transform: translateX(-3px); }
      40% { transform: translateX(3px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    .shake {
      animation: tremor 0.8s ease-in-out;
    }

    #destino {
      display: none;
      margin-top: 18px;
      color: #ff4444;
      font-style: italic;
    }
  </style>
</head>

<body>

  <h1>💀 Dimensão Fantasma 💀</h1>

  <a href="quiz-inicial.html" class="btn" id="quizBtn">
    👉 Entrar no Ghost Quiz
  </a>

  <p id="destino">O seu destino foi traçado…</p>

  <script>
    const btn = document.getElementById("quizBtn");
    const destino = document.getElementById("destino");

    btn.addEventListener("click", function (e) {
      e.preventDefault();

      btn.classList.add("shake");
      btn.style.pointerEvents = "none";
      destino.style.display = "block";

      setTimeout(() => {
        window.location.href = "quiz-inicial.html";
      }, 1500);
    });
  </script>

</body>
</html>
