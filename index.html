<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Quiz</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0b0b;
  color:#eee;
  text-align:center;
}
#app{
  max-width:600px;
  margin:40px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
}
button{
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#8b0000;
  color:#fff;
}
input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:none;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* ===== ÁUDIO ===== */
const audio = new Audio();
document.addEventListener("click",()=>{
  audio.src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg";
  audio.play().then(()=>{audio.pause();audio.currentTime=0;}).catch(()=>{});
},{once:true});

function somAcerto(){
  audio.src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg";
  audio.play().catch(()=>{});
}
function somErro(){
  audio.src="https://actions.google.com/sounds/v1/cartoon/boing.ogg";
  audio.play().catch(()=>{});
}

/* ===== BANCO ===== */
const banco={
  terror:[{q:"Quem é o vilão de Halloween?",o:["Freddy","Jason","Michael Myers","Chucky"],c:2}],
  invocacao:[{q:"Qual filme faz parte do universo Invocação?",o:["Jogos Mortais","Annabelle","It","A Bruxa"],c:1}],
  lendas:[{q:"Lenda urbana famosa?",o:["Loira do Banheiro","Alien","Drácula","Kraken"],c:0}]
};

let perguntas=[], atual=0, pontos=0, tempo=15, intervalo=null;

/* ===== RANKING ===== */
function salvarRanking(nome,pontos){
  let r=JSON.parse(localStorage.getItem("ghostRanking"))||[];
  r.push({nome,pontos});
  r.sort((a,b)=>b.pontos-a.pontos);
  localStorage.setItem("ghostRanking",JSON.stringify(r.slice(0,10)));
}
function telaRanking(){
  let r=JSON.parse(localStorage.getItem("ghostRanking"))||[];
  app.innerHTML=`
    <h2>🏆 Ranking Fantasma</h2>
    <ol>${r.map(i=>`<li>${i.nome} — ${i.pontos} pts</li>`).join("")}</ol>
    <button onclick="telaInicial()">Voltar</button>
  `;
}

/* ===== TELAS ===== */
const app=document.getElementById("app");

function telaInicial(){
  app.innerHTML=`
    <h1>Ghost Quiz 👻</h1>
    <p>Você ousa entrar nesta dimensão?</p>
    <input id="nome" placeholder="Seu nome (opcional)">
    <button onclick="telaTempo()">Iniciar Quiz</button>
    <button onclick="telaRanking()">Ver Ranking</button>
  `;
}

function telaTempo(){
  app.innerHTML=`
    <h2>Escolha o tempo</h2>
    <button onclick="definirTempo(15)">15s</button>
    <button onclick="definirTempo(30)">30s</button>
  `;
}

function definirTempo(t){tempo=t;telaTema();}

function telaTema(){
  app.innerHTML=`
    <h2>Escolha o tema</h2>
    <button onclick="selecionarTema('terror')">🔪 Terror</button>
    <button onclick="selecionarTema('invocacao')">📖 Invocação</button>
    <button onclick="selecionarTema('lendas')">🌫️ Lendas</button>
  `;
}

function selecionarTema(t){
  perguntas=banco[t];
  atual=0; pontos=0;
  carregar();
}

/* ===== QUIZ ===== */
function carregar(){
  clearInterval(intervalo);
  let rest=tempo;
  app.innerHTML=`
    <h3>${perguntas[atual].q}</h3>
    <p id="timer">⏱ ${rest}s</p>
    ${perguntas[atual].o.map((op,i)=>`<button onclick="responder(${i})">${op}</button>`).join("")}
    <p id="fb"></p>
  `;
  intervalo=setInterval(()=>{
    rest--;
    document.getElementById("timer").innerText="⏱ "+rest+"s";
    if(rest<=0){
      clearInterval(intervalo);
      somErro();
      document.getElementById("fb").innerText="Tempo esgotado!";
      setTimeout(proxima,800);
    }
  },1000);
}

function responder(i){
  clearInterval(intervalo);
  if(i===perguntas[atual].c){
    pontos++; somAcerto();
    document.getElementById("fb").innerText="Correto!";
  }else{
    somErro();
    document.getElementById("fb").innerText="Errado!";
  }
  setTimeout(proxima,800);
}

function proxima(){
  atual++;
  if (atual >= perguntas.length) {
    fim();
  } else {
    carregar();
  }

function fim(){
  const nome=document.getElementById("nome").value||"Anônimo";
  salvarRanking(nome,pontos);
  app.innerHTML=`
    <h2>Sua alma foi julgada…</h2>
    <p>Pontuação: <b>${pontos}</b></p>
    <button onclick="telaRanking()">Ver Ranking</button>
    <button onclick="telaInicial()">Jogar novamente</button>
  `;
}

telaInicial();
</script>

</body>
</html>
